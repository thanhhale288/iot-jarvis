<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Jarvis</div>
    </header>
    <main class="thread" id="thread">
      <div class="col">
        <div class="empty" id="empty">
          <h1>Xin chào</h1>
          <p>Mình là Jarvis. Gõ một câu hoặc bấm mic — câu trả lời hiện ở đây và được đọc thành tiếng.</p>
        </div>
        <div id="messages" class="messages"></div>
      </div>
    </main>
    <div class="dock">
      <div class="col">
        <p class="fineprint">Jarvis là trợ lý trên bàn học và có thể mắc sai sót.</p>
        <form id="composer" class="composer" autocomplete="off">
          <label class="sr" for="input">Câu hỏi</label>
          <textarea id="input" rows="1" placeholder="Hỏi Jarvis"></textarea>
          <div class="bar">
            <div class="plus-wrap">
              <button type="button" id="plus" aria-label="Thêm" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
                </svg>
              </button>
              <div id="menu" class="menu" hidden>
                <button type="button" id="clear">Xóa cuộc trò chuyện</button>
              </div>
            </div>
            <span id="status">Sẵn sàng</span>
            <span class="grow"></span>
            <span id="model">Jarvis</span>
            <button type="button" id="mic" aria-label="Nói">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"/>
                <path d="M6 11a6 6 0 0 0 12 0" stroke-linecap="round"/>
                <path d="M12 17v3" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="submit" id="send" aria-label="Gửi" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.59 5.58L20 12l-8-8-8 8z"/>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
